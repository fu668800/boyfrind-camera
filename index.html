<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3f5">
<title>男友相機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one-screen pastel camera — title bar, rounded viewfinder with live hint bubble, exposure dial, edit panel, mode pills, shutter deck */
:root{
  --bg:#fff3f5; --card:#ffffff; --soft:#ffe3ea; --line:#f6cdd8;
  --ink:#5a3e4b; --mute:#a3818f; --pink:#ff7fa3; --pink-deep:#f0577f; --mint:#5cc9a7; --butter:#ffcf5c; --stage:#3a2c35;
  --f-title:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px}
.brand{font-family:var(--f-title);font-weight:700;font-size:20px;display:flex;align-items:center;gap:6px}
.brand i{font-style:normal;color:var(--pink)}
.now{font-size:12px;color:var(--mute);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center}
.now b{color:var(--ink)}
.rec{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rec.on{background:var(--pink);box-shadow:0 0 0 3px rgba(255,127,163,.25)}

.stage{position:relative;min-height:0;background:var(--stage);border-radius:24px;overflow:hidden;border:3px solid var(--card);box-shadow:0 6px 18px rgba(240,87,127,.15)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tag{position:absolute;top:10px;left:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font-size:12px;line-height:1.5;padding:5px 11px;border-radius:12px;background:rgba(255,255,255,.92);color:var(--ink)}
.bubble{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  font:700 15px var(--f-ui);padding:8px 16px;border-radius:999px;background:var(--butter);color:#5a3a00;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:background .2s}
.bubble.ok{background:var(--mint);color:#fff}
.bubble .arrow{font:800 18px var(--f-num);display:inline-block}
.bubble .arrow.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.9;transition:none}

.under{display:grid;gap:8px;padding-block:10px 0}
.tip{font-size:13px;color:var(--mute);text-align:center;min-height:1.4em}
.tip::before{content:"♡ ";color:var(--pink)}
.ev{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 12px}
.ev svg{width:20px;height:20px;stroke:var(--butter);fill:none;stroke-width:2.2;stroke-linecap:round}
.ev output{font:800 13px var(--f-num);color:var(--ink);min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums}
.ev label{font-size:12px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--pink)}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.seg .lbl{font-size:12px;color:var(--mute);margin-right:2px}
.chip.alt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}

.panel{display:grid;gap:10px;padding-block:10px 4px}
.tabs{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px}
.tabs button{flex:1;font:700 13px var(--f-ui);color:var(--mute);background:none;border:0;border-radius:999px;padding:6px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--card);box-shadow:0 2px 6px rgba(240,87,127,.15)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.film{position:relative;flex:0 0 auto;display:grid;gap:4px;justify-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--mute);font:700 12px var(--f-ui)}
.film canvas{width:58px;height:58px;border-radius:16px;border:3px solid var(--card);box-shadow:0 2px 6px rgba(90,62,75,.12)}
.film[aria-pressed="true"]{color:var(--pink-deep)}
.film[aria-pressed="true"] canvas{border-color:var(--pink)}
.hot{position:absolute;top:-4px;right:-6px;font:800 10px var(--f-num);background:var(--pink);color:#fff;border-radius:999px;padding:1px 6px;border:2px solid var(--bg)}
.sliders{display:grid;gap:6px;max-height:156px;overflow-y:auto;padding-right:4px}
.sl{display:grid;grid-template-columns:4.2em 1fr 2.6em;align-items:center;gap:10px;font-size:13px}
.sl output{font:800 12px var(--f-num);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 13px var(--f-ui);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip.small{font-size:12px;padding:4px 12px}

.modes{display:flex;justify-content:center;gap:8px;padding-block:8px 0}
.modes button{background:var(--card);border:1.5px solid var(--line);border-radius:999px;font:700 14px var(--f-title);color:var(--mute);cursor:pointer;padding:6px 16px}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px))}
.side{display:grid;justify-items:center;gap:4px;font:700 12px var(--f-ui);color:var(--mute);background:none;border:0;cursor:pointer}
.side .ic{width:48px;height:48px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center}
.side svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid var(--card);background:var(--soft);padding:5px;cursor:pointer;box-shadow:0 4px 14px rgba(240,87,127,.3)}
.shutter span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--pink);color:#fff;font-size:22px;transition:transform .12s}
.shutter.retake span{background:var(--butter)}
.shutter:active span{transform:scale(.88)}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;z-index:6;max-width:90vw;text-align:center}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){.shutter span,.flash,.bubble{transition:none}.bubble .arrow.bob{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><i>♥</i>男友相機</span>
    <span class="now"><span class="rec" id="rec"></span><b id="modeName">人像</b>·<span id="fname">原色</span></span>
  </header>

  <div class="stage">
    <canvas id="view" aria-label="取景畫面"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <span class="tag" id="tag">正在開啟鏡頭…</span>
    <div class="bubble" id="bubble" hidden><span class="arrow" id="arrow"></span><span id="btext"></span></div>
    <div class="flash" id="flash"></div>
  </div>

  <section class="under">
    <div class="tip" id="tip" aria-live="polite"></div>
    <div class="ev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <input type="range" id="ev" min="-20" max="20" value="0" aria-label="曝光">
      <output id="evOut">±0 EV</output>
    </div>
    <div class="seg" id="foodAngle" hidden>
      <span class="lbl">角度</span>
      <button class="chip small alt" data-fa="top" aria-pressed="true">俯拍 90°</button>
      <button class="chip small alt" data-fa="45" aria-pressed="false">斜拍 45°</button>
    </div>
    <div class="seg" id="compo"></div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="filters" id="tab-filters">濾鏡</button>
      <button role="tab" aria-selected="false" data-tab="adjust" id="tab-adjust">微調</button>
      <button role="tab" aria-selected="false" data-tab="frame" id="tab-frame">相框</button>
    </div>
    <div id="pane-filters" class="strip"></div>
    <div id="pane-adjust" class="sliders" hidden></div>
    <div id="pane-frame" class="opts" hidden>
      <button class="chip" data-frame="none" aria-pressed="true">無相框</button>
      <button class="chip" data-frame="white" aria-pressed="false">白邊</button>
      <button class="chip" data-frame="polaroid" aria-pressed="false">拍立得</button>
      <button class="chip" id="stampBtn" aria-pressed="false">日期印記</button>
      <button class="chip" id="gridBtn" aria-pressed="true">構圖格線</button>
    </div>
  </section>

  <div class="modes">
    <button data-mode="portrait" aria-pressed="true">人像</button>
    <button data-mode="landscape" aria-pressed="false">風景</button>
    <button data-mode="food" aria-pressed="false">美食</button>
  </div>

  <nav class="deck">
    <button class="side" id="galleryBtn" style="justify-self:start">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>相簿
    </button>
    <button class="shutter" id="shutterBtn" aria-label="拍照"><span>♥</span></button>
    <button class="side" id="flipBtn" style="justify-self:end">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>翻轉
    </button>
    <button class="side" id="saveBtn" style="justify-self:end" hidden>
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>儲存
    </button>
  </nav>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment">
<input type="file" id="picIn" accept="image/*">
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 濾鏡庫（網路熱門配色） ----------
   exp 曝光(EV)  con 對比  sat 飽和  vib 自然飽和  warm 色溫  tint 色調(+綠/-洋紅)
   hiL 亮部  shL 陰影  sh/hi 陰影與亮部染色[r,g,b]  fade 褪色  vig 暗角  grain 顆粒  gray 黑白  sepia 棕褐 */
const LIB={
  none:{n:"原色"},
  cream:{n:"奶油白",hot:1,exp:.25,con:.85,sat:.8,warm:.12,fade:.12,shL:.2,hi:[8,4,-6]},
  kclear:{n:"韓系清透",hot:1,exp:.2,con:.88,sat:.9,warm:-.05,tint:-.04,shL:.15,hi:[8,-2,5]},
  coolfair:{n:"冷白皮",exp:.22,con:.95,sat:.85,warm:-.25,hi:[0,4,10]},
  peach:{n:"蜜桃粉",hot:1,exp:.12,warm:.08,tint:-.1,sat:1.05,fade:.08,hi:[12,0,4]},
  portra:{n:"Portra",warm:.15,sat:.92,con:.95,fade:.08,shL:.1,sh:[0,4,6],hi:[10,6,0]},
  soft:{n:"柔膚",exp:.12,con:.9,sat:.95,warm:.12,fade:.06,shL:.15},
  air:{n:"日系空氣",exp:.2,con:.85,sat:.82,warm:-.08,tint:.05,fade:.15,shL:.2},
  ccd:{n:"CCD",hot:1,exp:.3,con:1.12,sat:1.08,warm:-.12,tint:.03,grain:12,vig:.15,hiL:-.2,hi:[0,2,10]},
  hk:{n:"港風",warm:.18,tint:-.06,sat:1.2,con:1.15,vig:.45,grain:8,sh:[-6,4,8],hi:[12,4,-6]},
  polaroid:{n:"拍立得",fade:.25,sat:.85,warm:.1,con:.9,vig:.3,sh:[-4,6,4],hi:[10,8,0]},
  fujineg:{n:"富士負片",hot:1,con:1.12,sat:.9,warm:-.05,hiL:-.15,sh:[-4,6,10],hi:[10,4,-6]},
  gold:{n:"金柯達",warm:.35,sat:1.12,con:1.05,fade:.06,vig:.2,grain:6,hi:[10,6,-8]},
  tealorange:{n:"青橙",hot:1,sat:1.15,con:1.1,sh:[-10,4,14],hi:[14,4,-10]},
  golden:{n:"黃金時刻",warm:.42,sat:1.15,con:1.08,vig:.3},
  sky:{n:"藍天",warm:-.18,sat:1.25,con:1.1,hiL:-.1},
  moody:{n:"暗黑森系",exp:-.2,sat:.75,con:1.1,tint:.1,fade:.1,vig:.5,sh:[-4,6,4]},
  morandi:{n:"莫蘭迪",sat:.55,con:.85,fade:.2,warm:.05},
  maillard:{n:"美拉德",hot:1,warm:.4,sat:.9,sepia:.2,con:1.05,vig:.3,sh:[10,2,-8]},
  cyber:{n:"賽博",warm:-.2,tint:-.15,sat:1.25,con:1.15,sh:[6,-6,18],hi:[16,-4,10]},
  blackgold:{n:"黑金",gray:.6,warm:.5,con:1.3,hi:[18,8,-12]},
  mist:{n:"霧感",sat:.7,con:.8,fade:.35,exp:.1},
  bw:{n:"黑白",gray:1,con:1.25,vig:.35,grain:10},
  tasty:{n:"美味",warm:.25,sat:1.25,con:1.08,exp:.08},
  fresh:{n:"清新",exp:.15,warm:-.06,sat:1.05,con:.95,fade:.08},
  vivid:{n:"鮮豔",sat:1.45,con:1.15},
  dopamine:{n:"多巴胺",hot:1,exp:.1,sat:1.5,vib:.3,con:1.1},
  cafe:{n:"咖啡館",warm:.2,sat:.85,con:1.05,fade:.15,vig:.35},
  caramel:{n:"焦糖",warm:.3,sepia:.3,con:1.08,sat:.95,vig:.3,grain:6},
  dessert:{n:"甜點",exp:.18,warm:.08,tint:-.04,sat:1.1,con:.92},
};
/* 角度目標：tilt = 鏡頭仰角（0 = 平視，-90 = 正下方） */
const MODES={
  portrait:{name:"人像",filters:["none","cream","kclear","coolfair","peach","ccd","portra","soft","air","fujineg","hk","polaroid","bw"],
    target:{tilt:-8,tol:8},tips:["眼睛放在上面那條線","手機比眼睛高一點，微微往下拍","找側面來的光，避開頭頂光","腳底對齊畫面最下緣，腿會變長"]},
  landscape:{name:"風景",filters:["none","fujineg","tealorange","gold","golden","sky","moody","morandi","maillard","cyber","blackgold","mist","bw"],
    target:{tilt:0,tol:6},tips:["地平線放在上或下三分之一","前景放點東西，畫面更有層次","逆光時把曝光往左拉一點"]},
  food:{name:"美食",filters:["none","tasty","cream","maillard","dopamine","cafe","caramel","dessert","fresh","gold","polaroid","vivid"],
    angles:{top:{tilt:-90,tol:7,bubble:true},"45":{tilt:-45,tol:8}},
    tips:{top:["正上方俯拍，適合一整桌菜、披薩","把黃點移進圓圈中央"],"45":["45° 像坐在桌前看，適合漢堡、蛋糕、飲料","主角放在下方交叉點"]}},
};
/* 構圖模板：直接在畫面上框出「什麼放哪裡」。座標是畫面比例 0~1；ghost = 淡框（留白、天空） */
const COMPO={
  portrait:[
    {id:"half",n:"半身",tip:"臉放進小框，眼睛對齊上方那條線",hl:[{h:1/3}],z:[
      {x:.2,y:.14,w:.6,h:.86,t:"人物（半身）"},{x:.35,y:.2,w:.3,h:.24,t:"臉"}]},
    {id:"full",n:"全身",tip:"頭在上方線附近，腳底貼齊畫面最下面，腿會變長",hl:[{h:1/3}],z:[
      {x:.3,y:.06,w:.4,h:.94,t:"人物（全身）・腳貼底邊"}]},
    {id:"left",n:"人在左",tip:"人站在左邊那條線，右邊留白放風景",hl:[{v:1/3}],z:[
      {x:.1,y:.14,w:.46,h:.86,t:"人物"},{x:.6,y:.14,w:.34,h:.5,t:"留白・風景",ghost:1}]},
    {id:"right",n:"人在右",tip:"人站在右邊那條線，左邊留白放風景",hl:[{v:2/3}],z:[
      {x:.44,y:.14,w:.46,h:.86,t:"人物"},{x:.06,y:.14,w:.34,h:.5,t:"留白・風景",ghost:1}]},
  ],
  landscape:[
    {id:"sky",n:"天空多",tip:"山的稜線放下面那條線，適合晚霞、雲很美的時候",hl:[{h:2/3}],z:[
      {x:.02,y:.02,w:.96,h:.56,t:"天空 2/3",ghost:1},{x:.02,y:.56,w:.96,h:.2,t:"山・地平線放這裡"},{x:.58,y:.2,w:.22,h:.2,t:"太陽"}]},
    {id:"land",n:"地面多",tip:"山的稜線放上面那條線，下面放花、石頭當前景",hl:[{h:1/3}],z:[
      {x:.02,y:.02,w:.96,h:.24,t:"天空 1/3",ghost:1},{x:.02,y:.24,w:.96,h:.2,t:"山・地平線放這裡"},{x:.06,y:.56,w:.44,h:.38,t:"前景：花、石頭"}]},
    {id:"sym",n:"倒影",tip:"有湖面倒影時，才把地平線放在正中間",hl:[{h:1/2}],z:[
      {x:.02,y:.3,w:.96,h:.2,t:"山"},{x:.02,y:.5,w:.96,h:.2,t:"倒影",ghost:1}]},
  ],
  food:[
    {id:"one",n:"單一主角",tip:"一道菜就放大放滿，留一點盤子邊緣",
      top:{hl:[],z:[{x:.16,y:.24,w:.68,h:.52,t:"主菜"}]},
      "45":{hl:[{h:2/3}],z:[{x:.14,y:.44,w:.72,h:.42,t:"主菜放下半部"}]}},
    {id:"set",n:"套餐擺盤",tip:"主菜放左下，飲料放右上，畫面會比較活潑",
      top:{hl:[{v:1/3},{h:2/3}],z:[{x:.06,y:.42,w:.52,h:.44,t:"主菜"},{x:.6,y:.1,w:.3,h:.24,t:"飲料"},{x:.64,y:.62,w:.28,h:.2,t:"小菜・餐具",ghost:1}]},
      "45":{hl:[{v:1/3},{h:2/3}],z:[{x:.06,y:.5,w:.56,h:.4,t:"主菜"},{x:.64,y:.12,w:.26,h:.4,t:"飲料放後面"}]}},
  ],
};
const ADJ=[
  {k:"amt",n:"濾鏡強度",min:0,max:100,def:100},
  {k:"hiL",n:"亮部"},{k:"shL",n:"陰影"},{k:"con",n:"對比"},{k:"sat",n:"飽和"},{k:"vib",n:"自然飽和"},
  {k:"warm",n:"色溫"},{k:"tint",n:"色調"},{k:"fade",n:"褪色"},{k:"vig",n:"暗角"},{k:"grain",n:"顆粒",min:0,max:100,def:0},
];
const ADJ0=Object.fromEntries(ADJ.map(a=>[a.k,(a.def??0)/100]));

const S={compo:{portrait:"half",landscape:"sky",food:"one"},mode:"portrait",pick:{portrait:"none",landscape:"none",food:"none"},adj:{...ADJ0},ev:0,frame:"none",stamp:false,grid:true,
  foodAngle:"top",live:false,src:null,stream:null,facing:"environment",u:null,okPrev:false,noCam:false,isSample:false};
const $=id=>document.getElementById(id);
const view=$("view"),video=$("video");
const filter=()=>LIB[S.pick[S.mode]];

/* 濾鏡 + 微調 → 一組參數 */
function params(f,adj,ev){
  const k=adj.amt,z=[0,0,0];
  return {
    exp:(f.exp||0)*k+ev, hiL:(f.hiL||0)*k+adj.hiL*.8, shL:(f.shL||0)*k+adj.shL*.8,
    con:(1+((f.con??1)-1)*k)*(1+adj.con*.5), sat:Math.max(0,(1+((f.sat??1)-1)*k)*(1+adj.sat)), vib:(f.vib||0)*k+adj.vib,
    warm:(f.warm||0)*k+adj.warm*.6, tint:(f.tint||0)*k+adj.tint*.6, gray:(f.gray||0)*k, sepia:(f.sepia||0)*k,
    sh:(f.sh||z).map(v=>v*k), hi:(f.hi||z).map(v=>v*k),
    fade:Math.max(0,(f.fade||0)*k+adj.fade*.5), vig:Math.max(-.5,(f.vig||0)*k+adj.vig*.8), grain:Math.max(0,(f.grain||0)*k+adj.grain*30),
  };
}
const NEUTRAL={...ADJ0,amt:1};

function processInto(ctx,w,h,P){
  const id=ctx.getImageData(0,0,w,h),d=id.data;
  const m=Math.pow(2,P.exp),{hiL,shL,con,sat,vib,warm,tint,gray,sepia,sh,hi,fade,vig,grain}=P;
  const cx=w/2,cy=h/2,md=cx*cx+cy*cy;
  for(let y=0,p=0;y<h;y++)for(let x=0;x<w;x++,p+=4){
    let r=d[p]*m,g=d[p+1]*m,b=d[p+2]*m;
    let l=Math.min(1,Math.max(0,(.299*r+.587*g+.114*b)/255));
    if(hiL||shL){const t=shL*70*(1-l)*(1-l)+hiL*70*l*l;r+=t;g+=t;b+=t}
    r=(r-128)*con+128;g=(g-128)*con+128;b=(b-128)*con+128;
    let L=.299*r+.587*g+.114*b,s=sat;
    if(vib){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);s*=1+vib*(1-Math.min(1,(mx-mn)/255))}
    r=L+(r-L)*s;g=L+(g-L)*s;b=L+(b-L)*s;
    r+=warm*28;b-=warm*28;g+=tint*18;
    if(gray){L=.299*r+.587*g+.114*b;r=L*gray+r*(1-gray);g=L*gray+g*(1-gray);b=L*gray+b*(1-gray)}
    if(sepia){L=.299*r+.587*g+.114*b;r=r*(1-sepia)+(L*1.07+20)*sepia;g=g*(1-sepia)+(L*.88+8)*sepia;b=b*(1-sepia)+L*.68*sepia}
    l=Math.min(1,Math.max(0,(.299*r+.587*g+.114*b)/255));
    r+=sh[0]*(1-l)+hi[0]*l;g+=sh[1]*(1-l)+hi[1]*l;b+=sh[2]*(1-l)+hi[2]*l;
    if(fade){r=r*(1-fade*.35)+40*fade;g=g*(1-fade*.35)+38*fade;b=b*(1-fade*.35)+44*fade}
    if(vig){const dx=x-cx,dy=y-cy,q=1-vig*Math.pow((dx*dx+dy*dy)/md,1.4);r*=q;g*=q;b*=q}
    if(grain){const n=(Math.random()-.5)*grain;r+=n;g+=n;b+=n}
    d[p]=r;d[p+1]=g;d[p+2]=b;
  }
  ctx.putImageData(id,0,0);
}
const pad2=n=>String(n).padStart(2,"0");
function stampText(){const t=new Date();return `'${pad2(t.getFullYear()%100)} ${pad2(t.getMonth()+1)} ${pad2(t.getDate())}`}

const work=document.createElement("canvas"),wctx=work.getContext("2d",{willReadFrequently:true});
function render(target,src,maxSide,{mirror=false,decor=true}={}){
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;if(!sw)return false;
  const sc=Math.min(1,maxSide/Math.max(sw,sh)),w=Math.round(sw*sc),h=Math.round(sh*sc);
  if(work.width!==w||work.height!==h){work.width=w;work.height=h}
  wctx.save();if(mirror){wctx.translate(w,0);wctx.scale(-1,1)}wctx.drawImage(src,0,0,w,h);wctx.restore();
  processInto(wctx,w,h,params(filter(),S.adj,S.ev));
  if(decor&&S.stamp){const fs=Math.round(Math.min(w,h)*.045);wctx.font=`800 ${fs}px Nunito,monospace`;wctx.textAlign="right";
    wctx.shadowColor="rgba(255,120,30,.8)";wctx.shadowBlur=fs*.4;wctx.fillStyle="#ff8a2a";wctx.fillText(stampText(),w-fs*.9,h-fs*.9);wctx.shadowBlur=0}
  const u=Math.round(Math.min(w,h)*.05);let pd=[0,0,0,0];
  if(decor&&S.frame==="white")pd=[u,u,u,u];if(decor&&S.frame==="polaroid")pd=[u,u,u*4.2,u];
  const tw=w+pd[1]+pd[3],th=h+pd[0]+pd[2];if(target.width!==tw||target.height!==th){target.width=tw;target.height=th}
  const t=target.getContext("2d");t.fillStyle="#fffaf6";t.fillRect(0,0,tw,th);t.drawImage(work,pd[3],pd[0]);
  if(decor&&S.frame==="polaroid"){t.fillStyle="#8a6a78";t.font=`700 ${Math.round(u*.95)}px "LXGW WenKai TC",sans-serif`;t.textAlign="left";
    t.fillText("♥ "+filter().n+" · "+stampText().slice(1).replace(/ /g,"."),pd[3],h+pd[0]+u*2.5)}
  return {x:pd[3],y:pd[0],w,h};
}

/* ---------- 感應器：算出鏡頭仰角與左右歪斜 ---------- */
const RAD=Math.PI/180;
function onOrient(e){
  if(e.beta==null)return;
  const b=e.beta*RAD,g=e.gamma*RAD;
  let ux=-Math.sin(g)*Math.cos(b),uy=Math.sin(b),uz=Math.cos(g)*Math.cos(b);
  const a=((screen.orientation&&screen.orientation.angle)??window.orientation??0)*RAD;
  const sx=ux*Math.cos(a)-uy*Math.sin(a),sy=ux*Math.sin(a)+uy*Math.cos(a);
  S.u={x:sx,y:sy,z:uz};
}
function pose(){
  if(!S.u)return null;
  const front=S.facing==="user";
  let tilt=Math.asin(Math.max(-1,Math.min(1,front?S.u.z:-S.u.z)))/RAD;
  let roll=Math.atan2(S.u.x,S.u.y);if(front)roll=-roll;
  return {tilt,roll};
}
let sensorAsked=false;
function initSensors(){
  if(!("DeviceOrientationEvent" in window))return;
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    document.addEventListener("click",async()=>{if(sensorAsked)return;sensorAsked=true;
      try{if(await DeviceOrientationEvent.requestPermission()==="granted")addEventListener("deviceorientation",onOrient)}catch(e){}},{capture:true});
  }else addEventListener("deviceorientation",onOrient);
}

/* ---------- 取景畫面上的格線與水平儀 ---------- */
function target(){const m=MODES[S.mode];return S.mode==="food"?m.angles[S.foodAngle]:m.target}
function judge(){
  const p=pose();if(!p)return null;const t=target();
  if(t.bubble){const dx=S.u.x,dy=S.u.y,dist=Math.hypot(dx,dy)/RAD;return {p,t,ok:dist<t.tol,bubble:true}}
  const err=p.tilt-t.tilt,rollDeg=p.roll/RAD;
  return {p,t,err,rollDeg,ok:Math.abs(err)<=t.tol&&Math.abs(rollDeg)<2.5};
}
function drawGuides(box,J){
  const c=view.getContext("2d"),{x,y,w,h}=box,lw=Math.max(1.5,w/320),cx=x+w/2,cy=y+h/2,mn=Math.min(w,h);
  c.save();c.lineCap="round";
  if(S.grid){
    const tp=compoNow();
    // 九宮格
    c.lineWidth=lw*.7;c.strokeStyle="rgba(255,255,255,.4)";c.setLineDash([]);
    c.beginPath();for(const k of[1,2]){c.moveTo(x+w*k/3,y);c.lineTo(x+w*k/3,y+h);c.moveTo(x,y+h*k/3);c.lineTo(x+w,y+h*k/3)}c.stroke();
    // 重點線
    c.lineWidth=lw*1.6;c.strokeStyle="rgba(255,127,163,.95)";
    for(const l of tp.hl){c.beginPath();if(l.h!=null){c.moveTo(x,y+h*l.h);c.lineTo(x+w,y+h*l.h)}else{c.moveTo(x+w*l.v,y);c.lineTo(x+w*l.v,y+h)}c.stroke()}
    // 框
    const fs=Math.max(11,Math.round(Math.min(w,h)*.038));c.font=`700 ${fs}px "Noto Sans TC",sans-serif`;c.textBaseline="middle";
    for(const z of tp.z){
      const zx=x+w*z.x,zy=y+h*z.y,zw=w*z.w,zh=h*z.h,rad=Math.min(zw,zh)*.12;
      c.setLineDash(z.ghost?[4*lw,5*lw]:[9*lw,6*lw]);c.lineWidth=z.ghost?lw:lw*1.8;
      c.strokeStyle=z.ghost?"rgba(255,255,255,.75)":"#ff7fa3";c.fillStyle=z.ghost?"rgba(255,255,255,.06)":"rgba(255,127,163,.14)";
      c.beginPath();c.roundRect?c.roundRect(zx,zy,zw,zh,rad):c.rect(zx,zy,zw,zh);c.fill();c.stroke();c.setLineDash([]);
      const tw=c.measureText(z.t).width+fs*1.1,th=fs*1.7,lx=Math.min(zx+fs*.4,x+w-tw-2),ly=zy+fs*.4;
      c.fillStyle=z.ghost?"rgba(255,255,255,.9)":"#ff7fa3";c.beginPath();c.roundRect?c.roundRect(lx,ly,tw,th,th/2):c.rect(lx,ly,tw,th);c.fill();
      c.fillStyle=z.ghost?"#5a3e4b":"#fff";c.fillText(z.t,lx+fs*.55,ly+th/2);
    }
  }
  if(J){
    const col=J.ok?"#5cc9a7":"#ffcf5c";
    if(J.bubble){
      const R=mn*.08,sc=mn*.9;
      c.lineWidth=lw*1.5;c.strokeStyle="rgba(255,255,255,.95)";c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();
      let dx=S.u.x*sc,dy=-S.u.y*sc;const lim=mn*.42,dd=Math.hypot(dx,dy);if(dd>lim){dx*=lim/dd;dy*=lim/dd}
      c.fillStyle=col;c.shadowColor="rgba(0,0,0,.3)";c.shadowBlur=6;c.beginPath();c.arc(cx+dx,cy+dy,R*.55,0,7);c.fill();
    }else{
      const L=w*.26,off=Math.max(-h*.42,Math.min(h*.42,J.err*h*.018));
      c.lineWidth=lw*1.3;c.strokeStyle="rgba(255,255,255,.95)";
      c.beginPath();c.moveTo(cx-L-lw*16,cy);c.lineTo(cx-L+lw*2,cy);c.moveTo(cx+L-lw*2,cy);c.lineTo(cx+L+lw*16,cy);c.stroke();
      c.beginPath();c.arc(cx,cy,lw*4,0,7);c.stroke();
      c.save();c.translate(cx,cy+off);c.rotate(J.p.roll);c.lineWidth=lw*3.2;c.strokeStyle=col;c.shadowColor="rgba(0,0,0,.3)";c.shadowBlur=6;
      c.beginPath();c.moveTo(-L,0);c.lineTo(L,0);c.stroke();c.restore();
    }
  }
  c.restore();
}
function updateBubble(J){
  const el=$("bubble");
  if(!S.live||!J){el.hidden=true;return}
  el.hidden=false;el.classList.toggle("ok",J.ok);
  let a="",t="";
  if(J.ok){a="✓";t="角度完美，拍吧！"}
  else if(J.bubble){a="●";t="把黃點移進圓圈"}
  else if(Math.abs(J.rollDeg)>=2.5){a=J.rollDeg<0?"↺":"↻";t="把手機轉正"}
  else if(J.err<0){a="↑";t="鏡頭往上抬一點"}
  else {a="↓";t="鏡頭往下壓一點"}
  $("arrow").textContent=a;$("arrow").classList.toggle("bob",!J.ok);$("btext").textContent=t;
  if(J.ok&&!S.okPrev&&navigator.vibrate)navigator.vibrate(25);
  S.okPrev=J.ok;
}
function compoDef(){return COMPO[S.mode].find(t=>t.id===S.compo[S.mode])}
function compoNow(){const d=compoDef();return S.mode==="food"?d[S.foodAngle]:d}
function buildCompo(){
  const box=$("compo");box.textContent="";
  const l=document.createElement("span");l.className="lbl";l.textContent="構圖";box.append(l);
  COMPO[S.mode].forEach(t=>{
    const b=document.createElement("button");b.className="chip small";b.textContent=t.n;b.setAttribute("aria-pressed",t.id===S.compo[S.mode]);
    b.onclick=()=>{S.compo[S.mode]=t.id;tipIdx=0;if(!S.grid){S.grid=true;$("gridBtn").setAttribute("aria-pressed",true)}buildCompo();updateTip()};
    box.append(b);
  });
}
let tipIdx=0;
function updateTip(){
  const m=MODES[S.mode],tips=[compoDef().tip,...(S.mode==="food"?m.tips[S.foodAngle]:m.tips)];
  $("tip").textContent=tips[tipIdx%tips.length];$("foodAngle").hidden=S.mode!=="food";
}
setInterval(()=>{tipIdx++;updateTip()},5000);

/* ---------- 鏡頭 ---------- */
async function startCamera(){
  stopCamera();
  if(!navigator.mediaDevices?.getUserMedia){noCamera("這個瀏覽器不能開鏡頭（需要用 https 網址開啟）");return}
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:1920},height:{ideal:1440}}});
    video.srcObject=S.stream;await video.play().catch(()=>{});
    S.live=true;$("tag").hidden=true;setLiveUI();
    if(video.readyState>=2)buildFilters();else video.addEventListener("loadeddata",()=>buildFilters(),{once:true});
    requestAnimationFrame(loop);
  }catch(e){noCamera(e&&e.name==="NotAllowedError"?"沒有相機權限：請在瀏覽器設定裡允許使用相機":"找不到可用的鏡頭")}
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}S.live=false;$("bubble").hidden=true}
function noCamera(msg){
  S.noCam=true;S.live=false;$("tag").hidden=false;$("tag").textContent=msg+"。還是可以按快門用手機相機拍，或從相簿選照片 ♡";
  if(!S.src)S.src=sampleImage();setLiveUI();buildFilters();refresh();
}
let lastT=0;
function loop(t){
  if(!S.live)return;
  if(video.readyState>=2&&t-lastT>30){lastT=t;
    const box=render(view,video,520,{mirror:S.facing==="user",decor:false});
    if(box){const J=judge();drawGuides(box,J);updateBubble(J)}}
  requestAnimationFrame(loop);
}
function capture(){
  const sw=video.videoWidth,sh=video.videoHeight;if(!sw)return;
  const sc=Math.min(1,2400/Math.max(sw,sh)),c=document.createElement("canvas");c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  const x=c.getContext("2d");if(S.facing==="user"){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(video,0,0,c.width,c.height);
  const f=$("flash");f.classList.add("go");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("go")));
  S.src=c;S.isSample=false;stopCamera();setLiveUI();buildFilters();refresh();
}
function setLiveUI(){
  const live=S.live;$("rec").classList.toggle("on",live);
  $("flipBtn").hidden=!live;$("saveBtn").hidden=live||!S.src||S.isSample;
  const sh=$("shutterBtn"),re=!live&&!!S.src&&!S.isSample&&!S.noCam;
  sh.classList.toggle("retake",re);sh.setAttribute("aria-label",re?"重拍":"拍照");sh.firstElementChild.textContent=re?"↺":"♥";
  updateTip();
}
function sampleImage(){
  const c=document.createElement("canvas");c.width=1200;c.height=1500;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,1000);g.addColorStop(0,"#3b5b8c");g.addColorStop(.55,"#e88b5a");g.addColorStop(1,"#f6cf8a");
  x.fillStyle=g;x.fillRect(0,0,1200,1500);x.fillStyle="#fde7b0";x.beginPath();x.arc(780,820,120,0,7);x.fill();
  const ridge=(y,a,col,s)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,1500);for(let i=0;i<=1200;i+=20)x.lineTo(i,y+Math.sin(i/170+s)*a+Math.sin(i/53+s*2)*a*.3);x.lineTo(1200,1500);x.fill()};
  ridge(930,60,"#7a5a72",1);ridge(1050,50,"#4d3d58",3);ridge(1180,40,"#2a2638",5);x.fillStyle="#1b1a24";x.fillRect(0,1320,1200,180);
  S.isSample=true;return c;
}

/* ---------- 介面 ---------- */
let raf;function refresh(){
  $("fname").textContent=filter().n;$("modeName").textContent=MODES[S.mode].name;
  if(S.live)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(S.src)render(view,S.src,1100)});
}
function buildFilters(){
  const strip=$("pane-filters");strip.textContent="";
  const src=S.live?video:S.src;const sw=src&&(src.videoWidth||src.width);if(!sw)return;const sh=src.videoHeight||src.height;
  const s=Math.min(sw,sh),th=88;
  MODES[S.mode].filters.forEach(id=>{
    const f=LIB[id],b=document.createElement("button");b.className="film";b.setAttribute("aria-pressed",id===S.pick[S.mode]);
    const c=document.createElement("canvas");c.width=c.height=th;const x=c.getContext("2d",{willReadFrequently:true});
    x.drawImage(src,(sw-s)/2,(sh-s)/2,s,s,0,0,th,th);processInto(x,th,th,params(f,NEUTRAL,0));
    const l=document.createElement("span");l.textContent=f.n;b.append(c,l);
    if(f.hot){const h=document.createElement("span");h.className="hot";h.textContent="HOT";b.append(h)}
    b.onclick=()=>{S.pick[S.mode]=id;strip.querySelectorAll(".film").forEach(e=>e.setAttribute("aria-pressed",e===b));refresh()};
    strip.append(b);
  });
}
function buildSliders(){
  const box=$("pane-adjust");
  ADJ.forEach(a=>{
    const row=document.createElement("label");row.className="sl";
    const n=document.createElement("span");n.textContent=a.n;
    const r=document.createElement("input");r.type="range";r.min=a.min??-100;r.max=a.max??100;r.value=a.def??0;r.id="adj-"+a.k;
    const o=document.createElement("output");
    const show=()=>{const v=+r.value;o.textContent=a.k==="amt"?v+"%":(v>0?"+":"")+v};show();
    r.oninput=()=>{S.adj[a.k]=r.value/100;show();refresh()};
    r.ondblclick=()=>{r.value=a.def??0;r.oninput()};
    row.append(n,r,o);box.append(row);
  });
  const reset=document.createElement("button");reset.className="chip small";reset.textContent="全部重設";reset.style.justifySelf="start";
  reset.onclick=()=>{ADJ.forEach(a=>{const r=$("adj-"+a.k);r.value=a.def??0;r.oninput()});$("ev").value=0;$("ev").oninput()};
  box.append(reset);
}
$("ev").oninput=e=>{S.ev=$("ev").value/10;const v=S.ev;$("evOut").textContent=(v===0?"±0":(v>0?"+":"")+v.toFixed(1))+" EV";refresh()};
$("ev").ondblclick=()=>{$("ev").value=0;$("ev").oninput()};
document.querySelectorAll(".tabs button").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(b=>{const on=b===t;b.setAttribute("aria-selected",on);$("pane-"+b.dataset.tab).hidden=!on})});
document.querySelectorAll("[data-frame]").forEach(b=>b.onclick=()=>{
  S.frame=b.dataset.frame;document.querySelectorAll("[data-frame]").forEach(e=>e.setAttribute("aria-pressed",e===b));refresh()});
$("stampBtn").onclick=e=>{S.stamp=!S.stamp;e.currentTarget.setAttribute("aria-pressed",S.stamp);refresh()};
$("gridBtn").onclick=e=>{S.grid=!S.grid;e.currentTarget.setAttribute("aria-pressed",S.grid)};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;tipIdx=0;document.querySelectorAll("[data-mode]").forEach(e=>e.setAttribute("aria-pressed",e===b));
  buildFilters();buildCompo();refresh();updateTip()});
document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{
  S.foodAngle=b.dataset.fa;tipIdx=0;document.querySelectorAll("[data-fa]").forEach(e=>e.setAttribute("aria-pressed",e===b));updateTip()});

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

async function loadFile(file){
  if(!file)return;
  try{
    let img;
    if(window.createImageBitmap)img=await createImageBitmap(file,{imageOrientation:"from-image"});
    else img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
    const sc=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    stopCamera();S.src=c;S.isSample=false;$("tag").hidden=true;setLiveUI();buildFilters();refresh();
  }catch(e){toast("這張照片讀不出來，換一張 JPG 或 PNG 試試")}
}
$("camIn").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("picIn").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("galleryBtn").onclick=()=>$("picIn").click();
$("shutterBtn").onclick=()=>{if(S.live)capture();else if(!S.noCam)startCamera();else $("camIn").click()};
$("flipBtn").onclick=()=>{S.facing=S.facing==="user"?"environment":"user";startCamera()};
$("saveBtn").onclick=()=>{
  const out=document.createElement("canvas");render(out,S.src,2400);
  out.toBlob(blob=>{
    const t=new Date(),name=`photo-${t.getFullYear()}${pad2(t.getMonth()+1)}${pad2(t.getDate())}-${pad2(t.getHours())}${pad2(t.getMinutes())}${pad2(t.getSeconds())}.jpg`;
    const file=new File([blob],name,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({files:[file]}).catch(()=>{});return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("已儲存照片 ♡");
  },"image/jpeg",.92);
};

buildSliders();buildCompo();initSensors();updateTip();startCamera();
</script>
