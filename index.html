<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff3f5">
<title>男友相機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: one-screen pastel camera — title bar, rounded viewfinder with live hint bubble, exposure dial, edit panel, mode pills, shutter deck */
:root{
  --bg:#fff3f5; --card:#ffffff; --soft:#ffe3ea; --line:#f6cdd8;
  --ink:#5a3e4b; --mute:#a3818f; --pink:#ff7fa3; --pink-deep:#f0577f; --mint:#5cc9a7; --butter:#ffcf5c; --stage:#3a2c35;
  --f-title:"LXGW WenKai TC","Noto Sans TC",system-ui,sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:minmax(0,1fr) auto auto auto;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* 取景畫面：盡量放大，標題、提示都疊在畫面上 */
.stage{position:relative;min-height:0;background:var(--stage);border-radius:0 0 26px 26px;overflow:hidden;margin-inline:-10px;box-shadow:0 6px 18px rgba(240,87,127,.15)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ov-top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.brand,.now{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 11px;display:flex;align-items:center;gap:6px}
.brand{font-family:var(--f-title);font-weight:700;font-size:15px}
.brand i{font-style:normal;color:var(--pink)}
.now{font-size:12px;color:var(--mute)}
.now b{color:var(--ink)}
.rec{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rec.on{background:var(--pink);box-shadow:0 0 0 3px rgba(255,127,163,.25)}
.tip{position:absolute;top:44px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;text-align:center;
  font-size:12px;line-height:1.45;color:#fff;background:rgba(58,44,53,.62);padding:4px 12px;border-radius:999px;pointer-events:none}
.tip::before{content:"♡ ";color:#ffb3c7}
.tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:calc(100% - 32px);font-size:13px;line-height:1.5;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.94);color:var(--ink);text-align:center}
.bubble{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  font:700 15px var(--f-ui);padding:8px 16px;border-radius:999px;background:var(--butter);color:#5a3a00;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:background .2s}
.bubble.ok{background:var(--mint);color:#fff}
.bubble .arrow{font:800 18px var(--f-num);display:inline-block}
.bubble .arrow.bob{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.zoom{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:grid;gap:6px}
.zoom button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(58,44,53,.55);color:#fff;font:800 11px var(--f-num);cursor:pointer}
.zoom button[aria-pressed="true"]{background:var(--butter);color:#5a3a00}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.9;transition:none}

/* 工具列：一次只展開一種工具，高度固定 */
.panel{display:grid;gap:8px;padding-block:8px 0}
.tabs{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
.tabs button{flex:1;font:700 12px var(--f-ui);color:var(--mute);background:none;border:0;border-radius:999px;padding:5px 0;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--card);box-shadow:0 2px 6px rgba(240,87,127,.15)}
.pane{height:78px;overflow-y:auto}
.strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 2px 2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.film{position:relative;flex:0 0 auto;display:grid;gap:3px;justify-items:center;align-content:start;background:none;border:0;padding:0;cursor:pointer;color:var(--mute);font:700 11px var(--f-ui)}
.film canvas{width:50px;height:50px;border-radius:14px;border:3px solid var(--card);box-shadow:0 2px 6px rgba(90,62,75,.12)}
.film[aria-pressed="true"]{color:var(--pink-deep)}
.film[aria-pressed="true"] canvas{border-color:var(--pink)}
.hot{position:absolute;top:-3px;right:-6px;font:800 9px var(--f-num);background:var(--pink);color:#fff;border-radius:999px;padding:1px 5px;border:2px solid var(--bg)}
.sliders{display:grid;gap:4px;align-content:start;padding-right:4px}
.sl{display:grid;grid-template-columns:4.2em 1fr 2.6em;align-items:center;gap:10px;font-size:13px}
.sl output{font:800 12px var(--f-num);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.ev{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 12px;margin-top:6px}
.ev svg{width:20px;height:20px;stroke:var(--butter);fill:none;stroke-width:2.2;stroke-linecap:round}
.ev output{font:800 13px var(--f-num);color:var(--ink);min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums}
.evhint{font-size:12px;color:var(--mute);text-align:center;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--pink)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lbl{font-size:12px;color:var(--mute);width:2.6em}
.compo{display:grid;gap:6px;align-content:start;padding-top:2px;overflow-y:auto}
.compo .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.compo .row::-webkit-scrollbar{display:none}
.compo .row .chip{flex:0 0 auto;white-space:nowrap}
.credit{font-size:11px;color:var(--mute)}
.chip.alt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-content:start;padding-top:4px}
.chip{font:700 13px var(--f-ui);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip.small{font-size:12px;padding:4px 12px}

.modes{display:flex;justify-content:center;gap:6px;padding-block:6px 0}
.modes button{background:none;border:0;border-radius:999px;font:700 14px var(--f-title);color:var(--mute);cursor:pointer;padding:4px 14px}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.deck{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:4px calc(10px + env(safe-area-inset-bottom,0px))}
.side{display:grid;justify-items:center;gap:3px;font:700 11px var(--f-ui);color:var(--mute);background:none;border:0;cursor:pointer}
.side .ic{width:44px;height:44px;border-radius:15px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center}
.side svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shutter{width:70px;height:70px;border-radius:50%;border:5px solid var(--card);background:var(--soft);padding:4px;cursor:pointer;box-shadow:0 4px 14px rgba(240,87,127,.3)}
.shutter span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--pink);color:#fff;font-size:21px;transition:transform .12s}
.shutter.retake span{background:var(--butter)}
.shutter:active span{transform:scale(.88)}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;z-index:6;max-width:90vw;text-align:center}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){.shutter span,.flash,.bubble{transition:none}.bubble .arrow.bob{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="view" aria-label="取景畫面"></canvas>
    <video id="video" playsinline muted autoplay></video>
    <div class="ov-top">
      <span class="brand"><i>♥</i>男友相機</span>
      <span class="now"><span class="rec" id="rec"></span><b id="modeName">秋秋拍法</b>·<span id="fname">原色</span></span>
    </div>
    <div class="tip" id="tip" aria-live="polite"></div>
    <span class="tag" id="tag">正在開啟鏡頭…</span>
    <div class="zoom" id="zoom" hidden>
      <button data-z="0.5" aria-pressed="false">.5×</button>
      <button data-z="1" aria-pressed="true">1×</button>
      <button data-z="1.5" aria-pressed="false">1.5</button>
      <button data-z="2" aria-pressed="false">2×</button>
      <button data-z="3" aria-pressed="false">3×</button>
    </div>
    <div class="bubble" id="bubble" hidden><span class="arrow" id="arrow"></span><span id="btext"></span></div>
    <div class="flash" id="flash"></div>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="compo" id="tab-compo">構圖</button>
      <button role="tab" aria-selected="false" data-tab="filters" id="tab-filters">濾鏡</button>
      <button role="tab" aria-selected="false" data-tab="ev" id="tab-ev">曝光</button>
      <button role="tab" aria-selected="false" data-tab="adjust" id="tab-adjust">微調</button>
      <button role="tab" aria-selected="false" data-tab="frame" id="tab-frame">相框</button>
    </div>
    <div id="pane-compo" class="pane compo">
      <div class="seg" id="foodAngle" hidden>
        <span class="lbl">角度</span>
        <button class="chip small alt" data-fa="top" aria-pressed="true">俯拍 90°</button>
        <button class="chip small alt" data-fa="45" aria-pressed="false">斜拍 45°</button>
      </div>
      <div class="seg" id="compo"></div>
    </div>
    <div id="pane-filters" class="pane strip" hidden></div>
    <div id="pane-ev" class="pane" hidden>
      <div class="ev">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <input type="range" id="ev" min="-20" max="20" value="0" aria-label="曝光">
        <output id="evOut">±0 EV</output>
      </div>
      <div class="evhint">往右變亮、往左變暗，點兩下回到 0</div>
    </div>
    <div id="pane-adjust" class="pane sliders" hidden></div>
    <div id="pane-frame" class="pane opts" hidden>
      <button class="chip small" data-frame="none" aria-pressed="true">無相框</button>
      <button class="chip small" data-frame="white" aria-pressed="false">白邊</button>
      <button class="chip small" data-frame="polaroid" aria-pressed="false">拍立得</button>
      <button class="chip small" id="stampBtn" aria-pressed="false">日期印記</button>
      <button class="chip small" id="gridBtn" aria-pressed="true">構圖框線</button>
    </div>
  </section>

  <div class="modes">
    <button data-mode="qiu" aria-pressed="true">秋秋拍法</button>
    <button data-mode="portrait" aria-pressed="false">人像</button>
    <button data-mode="landscape" aria-pressed="false">風景</button>
    <button data-mode="dining" aria-pressed="false">聚餐</button>
    <button data-mode="food" aria-pressed="false">美食</button>
  </div>

  <nav class="deck">
    <button class="side" id="galleryBtn" style="justify-self:start">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></span>相簿
    </button>
    <button class="shutter" id="shutterBtn" aria-label="拍照"><span>♥</span></button>
    <button class="side" id="flipBtn" style="justify-self:end">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>翻轉
    </button>
    <button class="side" id="saveBtn" style="justify-self:end" hidden>
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>儲存
    </button>
  </nav>
</div>

<input type="file" id="camIn" accept="image/*" capture="environment">
<input type="file" id="picIn" accept="image/*">
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 濾鏡庫（網路熱門配色） ----------
   exp 曝光(EV)  con 對比  sat 飽和  vib 自然飽和  warm 色溫  tint 色調(+綠/-洋紅)
   hiL 亮部  shL 陰影  sh/hi 陰影與亮部染色[r,g,b]  fade 褪色  vig 暗角  grain 顆粒  gray 黑白  sepia 棕褐 */
const LIB={
  none:{n:"原色"},
  cream:{n:"奶油白",hot:1,exp:.25,con:.85,sat:.8,warm:.12,fade:.12,shL:.2,hi:[8,4,-6]},
  kclear:{n:"韓系清透",hot:1,exp:.2,con:.88,sat:.9,warm:-.05,tint:-.04,shL:.15,hi:[8,-2,5]},
  coolfair:{n:"冷白皮",exp:.22,con:.95,sat:.85,warm:-.25,hi:[0,4,10]},
  peach:{n:"蜜桃粉",hot:1,exp:.12,warm:.08,tint:-.1,sat:1.05,fade:.08,hi:[12,0,4]},
  portra:{n:"Portra",warm:.15,sat:.92,con:.95,fade:.08,shL:.1,sh:[0,4,6],hi:[10,6,0]},
  soft:{n:"柔膚",exp:.12,con:.9,sat:.95,warm:.12,fade:.06,shL:.15},
  air:{n:"日系空氣",exp:.2,con:.85,sat:.82,warm:-.08,tint:.05,fade:.15,shL:.2},
  ccd:{n:"CCD",hot:1,exp:.3,con:1.12,sat:1.08,warm:-.12,tint:.03,grain:12,vig:.15,hiL:-.2,hi:[0,2,10]},
  hk:{n:"港風",warm:.18,tint:-.06,sat:1.2,con:1.15,vig:.45,grain:8,sh:[-6,4,8],hi:[12,4,-6]},
  polaroid:{n:"拍立得",fade:.25,sat:.85,warm:.1,con:.9,vig:.3,sh:[-4,6,4],hi:[10,8,0]},
  fujineg:{n:"富士負片",hot:1,con:1.12,sat:.9,warm:-.05,hiL:-.15,sh:[-4,6,10],hi:[10,4,-6]},
  gold:{n:"金柯達",warm:.35,sat:1.12,con:1.05,fade:.06,vig:.2,grain:6,hi:[10,6,-8]},
  tealorange:{n:"青橙",hot:1,sat:1.15,con:1.1,sh:[-10,4,14],hi:[14,4,-10]},
  golden:{n:"黃金時刻",warm:.42,sat:1.15,con:1.08,vig:.3},
  sky:{n:"藍天",warm:-.18,sat:1.25,con:1.1,hiL:-.1},
  moody:{n:"暗黑森系",exp:-.2,sat:.75,con:1.1,tint:.1,fade:.1,vig:.5,sh:[-4,6,4]},
  morandi:{n:"莫蘭迪",sat:.55,con:.85,fade:.2,warm:.05},
  maillard:{n:"美拉德",hot:1,warm:.4,sat:.9,sepia:.2,con:1.05,vig:.3,sh:[10,2,-8]},
  cyber:{n:"賽博",warm:-.2,tint:-.15,sat:1.25,con:1.15,sh:[6,-6,18],hi:[16,-4,10]},
  blackgold:{n:"黑金",gray:.6,warm:.5,con:1.3,hi:[18,8,-12]},
  mist:{n:"霧感",sat:.7,con:.8,fade:.35,exp:.1},
  bw:{n:"黑白",gray:1,con:1.25,vig:.35,grain:10},
  tasty:{n:"美味",warm:.25,sat:1.25,con:1.08,exp:.08},
  fresh:{n:"清新",exp:.15,warm:-.06,sat:1.05,con:.95,fade:.08},
  vivid:{n:"鮮豔",sat:1.45,con:1.15},
  dopamine:{n:"多巴胺",hot:1,exp:.1,sat:1.5,vib:.3,con:1.1},
  cafe:{n:"咖啡館",warm:.2,sat:.85,con:1.05,fade:.15,vig:.35},
  caramel:{n:"焦糖",warm:.3,sepia:.3,con:1.08,sat:.95,vig:.3,grain:6},
  dessert:{n:"甜點",exp:.18,warm:.08,tint:-.04,sat:1.1,con:.92},
};
/* 角度目標：tilt = 鏡頭仰角（0 = 平視，-90 = 正下方） */
const MODES={
  qiu:{name:"秋秋拍法",filters:["none","cream","kclear","fujineg","gold","ccd","peach","portra","air","tasty","maillard","bw"],
    target:{tilt:-5,tol:10},tips:["拍法學自抖音 @秋秋脾氣好"]},
  portrait:{name:"人像",filters:["none","cream","kclear","coolfair","peach","ccd","portra","soft","air","fujineg","hk","polaroid","bw"],
    target:{tilt:-8,tol:8},tips:["眼睛放在上面那條線","手機比眼睛高一點，微微往下拍","找側面來的光，避開頭頂光","腳底對齊畫面最下緣，腿會變長"]},
  landscape:{name:"風景",filters:["none","fujineg","tealorange","gold","golden","sky","moody","morandi","maillard","cyber","blackgold","mist","bw"],
    target:{tilt:0,tol:6},tips:["地平線放在上或下三分之一","前景放點東西，畫面更有層次","逆光時把曝光往左拉一點"]},
  dining:{name:"聚餐",filters:["none","tasty","cream","kclear","peach","maillard","gold","hk","cafe","polaroid"],
    target:{tilt:-10,tol:10},tips:["先後退一點，讓桌上的菜擋在人前面","拍法學自抖音 @秋秋脾氣好 的火鍋構圖"]},
  food:{name:"美食",filters:["none","tasty","cream","maillard","dopamine","cafe","caramel","dessert","fresh","gold","polaroid","vivid"],
    angles:{top:{tilt:-90,tol:7,bubble:true},"45":{tilt:-45,tol:8}},
    tips:{top:["正上方俯拍，適合一整桌菜、披薩","把黃點移進圓圈中央"],"45":["45° 像坐在桌前看，適合漢堡、蛋糕、飲料","主角放在下方交叉點"]}},
};
/* 構圖模板：直接在畫面上框出「什麼放哪裡」。座標是畫面比例 0~1；ghost = 淡框（留白、天空） */
const COMPO={
  /* 秋秋拍法：整理自抖音 @秋秋脾氣好 約 80 支拍照教學影片。藍色 = 人要放的格子，紅十字 = 手／頭的位置，紅斜線 = 對角線構圖 */
  qiu:[
    /* ---------- 情侶・約會 ---------- */
    {cat:"情侶約會",id:"hand",n:"牽手照",land:1,zoom:1,steps:["手機橫過來","眉毛卡在第一條線","牽著的手從右下伸進來"],
      hl:[{h:1/3,t:"眉毛卡在這條線"}],z:[{x:.62,y:.6,w:.36,h:.38,t:"牽著的手",ghost:1}]},
    {cat:"情侶約會",id:"flowerGift",n:"收到花",zoom:1,tilt:{tilt:-5,tol:12},steps:["手機放低一點","花遞向鏡頭、放在下面中間那格","伸手摸她的頭入鏡"],
      hl:[{h:1/3,t:"眉毛卡在這條線"}],z:[{x:1/3,y:2/3,w:1/3,h:1/3,t:"花",fill:1},{x:2/3,y:.02,w:.31,h:.3,t:"你的手",ghost:1}]},

  let tilt=Math.asin(Math.max(-1,Math.min(1,front?S.u.z:-S.u.z)))/RAD;
  let roll=Math.atan2(S.u.x,S.u.y);if(front)roll=-roll;

      try{if(await DeviceOrientationEvent.requestPermission()==="granted")addEventListener("deviceorientation",onOrient)}catch(e){}},{capture:true});

    COMPO.qiu.filter(t=>t.cat===S.qiuCat).forEach(t=>r2.append(chip(t.n,t.id===S.compo.qiu,()=>pick(t))));
    box.append(r1,r2);
    const n=document.createElement("span");n.className="credit";n.textContent="♡ 拍法整理自抖音 @秋秋脾氣好 的拍照教學影片";box.append(n);
    return;
  }
  const l=document.createElement("span");l.className="lbl";l.textContent="版型";box.append(l);
  COMPO[S.mode].forEach(t=>box.append(chip(t.n,t.id===S.compo[S.mode],()=>pick(t))));
}
/* 變焦：手機支援就用真的鏡頭變焦，不支援就裁切放大 */
async function setZoom(z){
  S.zoom=z;S.dz=1;S.zoomNote="";
  const tr=S.stream&&S.stream.getVideoTracks()[0],caps=tr&&tr.getCapabilities?tr.getCapabilities():{};
  const hw=caps.zoom&&z>=caps.zoom.min&&z<=caps.zoom.max;
  if(hw){try{await tr.applyConstraints({advanced:[{zoom:z}]})}catch(e){S.dz=Math.max(1,z)}}
  else{S.dz=Math.max(1,z);if(z<1)S.zoomNote="網頁開不了 0.5 倍廣角，請再往後退一點"}
  if(!hw&&caps.zoom&&z>=1){try{await tr.applyConstraints({advanced:[{zoom:caps.zoom.min<=1?1:caps.zoom.min}]})}catch(e){}}
  document.querySelectorAll("[data-z]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.z===z));
  updateTip();
}
function applyTemplate(){
  const tp=compoNow();if(tp.zoom!=null&&tp.zoom!==S.zoom)setZoom(tp.zoom);else if(tp.zoom==null&&S.mode!=="qiu"&&S.zoom<1)setZoom(1);
  // 有指定曝光的場景（例如逆光剪影）自動調好；換到別的場景就回到 0
  const ev=tp.ev??0;if(ev!==S.ev&&(tp.ev!=null||S.autoEv)){$("ev").value=Math.round(ev*10);$("ev").oninput()}S.autoEv=tp.ev!=null;
}
let tipIdx=0;
const NUM="①②③④⑤";
function updateTip(){
  $("foodAngle").hidden=S.mode!=="food";
  const tp=compoNow();
  if(tp.steps){$("tip").textContent=tp.steps.map((s,i)=>NUM[i]+" "+s).join("　")+(S.zoomNote?"　("+S.zoomNote+")":"");return}
  const m=MODES[S.mode],tips=[compoDef().tip,...(S.mode==="food"?m.tips[S.foodAngle]:m.tips)];
  $("tip").textContent=tips[tipIdx%tips.length];
}
setInterval(()=>{tipIdx++;updateTip()},5000);

/* ---------- 鏡頭 ---------- */
async function startCamera(){
  stopCamera();
  if(!navigator.mediaDevices?.getUserMedia){noCamera("這個瀏覽器不能開鏡頭（需要用 https 網址開啟）");return}
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:1920},height:{ideal:1440}}});
    video.srcObject=S.stream;await video.play().catch(()=>{});
    S.live=true;$("tag").hidden=true;setLiveUI();setZoom(compoNow().zoom??S.zoom);
    if(video.readyState>=2)buildFilters();else video.addEventListener("loadeddata",()=>buildFilters(),{once:true});
    requestAnimationFrame(loop);
  }catch(e){noCamera(e&&e.name==="NotAllowedError"?"沒有相機權限：請在瀏覽器設定裡允許使用相機":"找不到可用的鏡頭")}
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}S.live=false;$("bubble").hidden=true}
function noCamera(msg){
  S.noCam=true;S.live=false;$("tag").hidden=false;$("tag").textContent=msg+"。還是可以按快門用手機相機拍，或從相簿選照片 ♡";
  if(!S.src)S.src=sampleImage();setLiveUI();buildFilters();refresh();
}
let lastT=0;
function loop(t){
  if(!S.live)return;
  if(video.readyState>=2&&t-lastT>30){lastT=t;
    const box=render(view,video,520,{mirror:S.facing==="user",decor:false});
    if(box){const J=judge();drawGuides(box,J);updateBubble(J)}}
  requestAnimationFrame(loop);
}
function capture(){
  if(!video.videoWidth)return;const r=crop(video),sw=r.sw,sh=r.sh;
  const sc=Math.min(1,2400/Math.max(sw,sh)),c=document.createElement("canvas");c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  const x=c.getContext("2d");if(S.facing==="user"){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(video,r.sx,r.sy,r.sw,r.sh,0,0,c.width,c.height);
  const f=$("flash");f.classList.add("go");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("go")));
  S.src=c;S.isSample=false;stopCamera();setLiveUI();buildFilters();refresh();
}
function setLiveUI(){
  const live=S.live;$("rec").classList.toggle("on",live);
  $("flipBtn").hidden=!live;$("saveBtn").hidden=live||!S.src||S.isSample;$("zoom").hidden=!live;
  const sh=$("shutterBtn"),re=!live&&!!S.src&&!S.isSample&&!S.noCam;
  sh.classList.toggle("retake",re);sh.setAttribute("aria-label",re?"重拍":"拍照");sh.firstElementChild.textContent=re?"↺":"♥";
  updateTip();
}
function sampleImage(){
  const c=document.createElement("canvas");c.width=1200;c.height=1500;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,1000);g.addColorStop(0,"#3b5b8c");g.addColorStop(.55,"#e88b5a");g.addColorStop(1,"#f6cf8a");
  x.fillStyle=g;x.fillRect(0,0,1200,1500);x.fillStyle="#fde7b0";x.beginPath();x.arc(780,820,120,0,7);x.fill();
  const ridge=(y,a,col,s)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,1500);for(let i=0;i<=1200;i+=20)x.lineTo(i,y+Math.sin(i/170+s)*a+Math.sin(i/53+s*2)*a*.3);x.lineTo(1200,1500);x.fill()};
  ridge(930,60,"#7a5a72",1);ridge(1050,50,"#4d3d58",3);ridge(1180,40,"#2a2638",5);x.fillStyle="#1b1a24";x.fillRect(0,1320,1200,180);
  S.isSample=true;return c;
}

/* ---------- 介面 ---------- */
let raf;function refresh(){
  $("fname").textContent=filter().n;$("modeName").textContent=MODES[S.mode].name;
  if(S.live)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(S.src)render(view,S.src,1100)});
}
function buildFilters(){
  const strip=$("pane-filters");strip.textContent="";
  const src=S.live?video:S.src;const sw=src&&(src.videoWidth||src.width);if(!sw)return;const sh=src.videoHeight||src.height;
  const s=Math.min(sw,sh),th=88;
  MODES[S.mode].filters.forEach(id=>{
    const f=LIB[id],b=document.createElement("button");b.className="film";b.setAttribute("aria-pressed",id===S.pick[S.mode]);
    const c=document.createElement("canvas");c.width=c.height=th;const x=c.getContext("2d",{willReadFrequently:true});
    x.drawImage(src,(sw-s)/2,(sh-s)/2,s,s,0,0,th,th);processInto(x,th,th,params(f,NEUTRAL,0));
    const l=document.createElement("span");l.textContent=f.n;b.append(c,l);
    if(f.hot){const h=document.createElement("span");h.className="hot";h.textContent="HOT";b.append(h)}
    b.onclick=()=>{S.pick[S.mode]=id;strip.querySelectorAll(".film").forEach(e=>e.setAttribute("aria-pressed",e===b));refresh()};
    strip.append(b);
  });
}
function buildSliders(){
  const box=$("pane-adjust");
  ADJ.forEach(a=>{
    const row=document.createElement("label");row.className="sl";
    const n=document.createElement("span");n.textContent=a.n;
    const r=document.createElement("input");r.type="range";r.min=a.min??-100;r.max=a.max??100;r.value=a.def??0;r.id="adj-"+a.k;
    const o=document.createElement("output");
    const show=()=>{const v=+r.value;o.textContent=a.k==="amt"?v+"%":(v>0?"+":"")+v};show();
    r.oninput=()=>{S.adj[a.k]=r.value/100;show();refresh()};
    r.ondblclick=()=>{r.value=a.def??0;r.oninput()};
    row.append(n,r,o);box.append(row);
  });
  const reset=document.createElement("button");reset.className="chip small";reset.textContent="全部重設";reset.style.justifySelf="start";
  reset.onclick=()=>{ADJ.forEach(a=>{const r=$("adj-"+a.k);r.value=a.def??0;r.oninput()});$("ev").value=0;$("ev").oninput()};
  box.append(reset);
}
$("ev").oninput=e=>{S.ev=$("ev").value/10;const v=S.ev;$("evOut").textContent=(v===0?"±0":(v>0?"+":"")+v.toFixed(1))+" EV";refresh()};
$("ev").ondblclick=()=>{$("ev").value=0;$("ev").oninput()};
document.querySelectorAll(".tabs button").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(b=>{const on=b===t;b.setAttribute("aria-selected",on);$("pane-"+b.dataset.tab).hidden=!on})});
document.querySelectorAll("[data-frame]").forEach(b=>b.onclick=()=>{
  S.frame=b.dataset.frame;document.querySelectorAll("[data-frame]").forEach(e=>e.setAttribute("aria-pressed",e===b));refresh()});
$("stampBtn").onclick=e=>{S.stamp=!S.stamp;e.currentTarget.setAttribute("aria-pressed",S.stamp);refresh()};
$("gridBtn").onclick=e=>{S.grid=!S.grid;e.currentTarget.setAttribute("aria-pressed",S.grid)};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;tipIdx=0;document.querySelectorAll("[data-mode]").forEach(e=>e.setAttribute("aria-pressed",e===b));
  buildFilters();buildCompo();applyTemplate();refresh();updateTip()});
document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>setZoom(+b.dataset.z));
document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{
  S.foodAngle=b.dataset.fa;tipIdx=0;document.querySelectorAll("[data-fa]").forEach(e=>e.setAttribute("aria-pressed",e===b));updateTip()});

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

async function loadFile(file){
  if(!file)return;
  try{
    let img;
    if(window.createImageBitmap)img=await createImageBitmap(file,{imageOrientation:"from-image"});
    else img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
    const sc=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    stopCamera();S.src=c;S.isSample=false;$("tag").hidden=true;setLiveUI();buildFilters();refresh();
  }catch(e){toast("這張照片讀不出來，換一張 JPG 或 PNG 試試")}
}
$("camIn").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("picIn").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("galleryBtn").onclick=()=>$("picIn").click();
$("shutterBtn").onclick=()=>{if(S.live)capture();else if(!S.noCam)startCamera();else $("camIn").click()};
$("flipBtn").onclick=()=>{S.facing=S.facing==="user"?"environment":"user";startCamera()};
$("saveBtn").onclick=()=>{
  const out=document.createElement("canvas");render(out,S.src,2400);
  out.toBlob(blob=>{
    const t=new Date(),name=`photo-${t.getFullYear()}${pad2(t.getMonth()+1)}${pad2(t.getDate())}-${pad2(t.getHours())}${pad2(t.getMinutes())}${pad2(t.getSeconds())}.jpg`;
    const file=new File([blob],name,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){navigator.share({files:[file]}).catch(()=>{});return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("已儲存照片 ♡");
  },"image/jpeg",.92);
};

buildSliders();buildCompo();initSensors();updateTip();startCamera();
</script>
